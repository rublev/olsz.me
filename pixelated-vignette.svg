<svg viewBox="0 0 1920 1280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Pixelation filter -->
    <filter id="pixelate" x="0%" y="0%" width="100%" height="100%">
      <feFlood x="0" y="0" width="8" height="8" flood-color="black"/>
      <feComposite operator="in" in="SourceGraphic"/>
      <feTile result="pixelated"/>
      <feComposite operator="in" in="pixelated" in2="SourceAlpha"/>
    </filter>

    <!-- Vignette gradient mask -->
    <mask id="vignette-mask">
      <rect width="1920" height="1280" fill="white"/>

      <!-- Top edge fade -->
      <rect x="0" y="0" width="1920" height="5" fill="black"/>
      <linearGradient id="fade-top" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="30%" stop-color="black" stop-opacity="0.925"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </linearGradient>
      <rect x="0" y="5" width="1920" height="150" fill="url(#fade-top)"/>

      <!-- Bottom edge fade -->
      <rect x="0" y="1275" width="1920" height="5" fill="black"/>
      <linearGradient id="fade-bottom" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="30%" stop-color="black" stop-opacity="0.925"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </linearGradient>
      <rect x="0" y="1125" width="1920" height="150" fill="url(#fade-bottom)"/>

      <!-- Left edge fade -->
      <rect x="0" y="0" width="5" height="1280" fill="black"/>
      <linearGradient id="fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="30%" stop-color="black" stop-opacity="0.925"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </linearGradient>
      <rect x="5" y="0" width="150" height="1280" fill="url(#fade-left)"/>

      <!-- Right edge fade -->
      <rect x="1915" y="0" width="5" height="1280" fill="black"/>
      <linearGradient id="fade-right" x1="100%" y1="0%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="30%" stop-color="black" stop-opacity="0.925"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </linearGradient>
      <rect x="1765" y="0" width="150" height="1280" fill="url(#fade-right)"/>

      <!-- Corner overlays for proper rectangular vignette -->
      <radialGradient id="corner-tl" cx="0%" cy="0%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="50%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <rect x="0" y="0" width="155" height="155" fill="url(#corner-tl)"/>

      <radialGradient id="corner-tr" cx="100%" cy="0%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="50%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <rect x="1765" y="0" width="155" height="155" fill="url(#corner-tr)"/>

      <radialGradient id="corner-bl" cx="0%" cy="100%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="50%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <rect x="0" y="1125" width="155" height="155" fill="url(#corner-bl)"/>

      <radialGradient id="corner-br" cx="100%" cy="100%">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="50%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <rect x="1765" y="1125" width="155" height="155" fill="url(#corner-br)"/>
    </mask>
  </defs>

  <!-- Main vignette rectangle with 7.5% opacity (0.075 intensity) -->
  <rect width="1920" height="1280" fill="black" opacity="0.075" mask="url(#vignette-mask)" style="image-rendering: pixelated;"/>
</svg>
