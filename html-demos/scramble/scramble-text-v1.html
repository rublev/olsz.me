<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        background: black;
        color: #0f0;
        font-family: monospace;
        font-size: 24px;
      }
      .scramble {
        display: inline-block;
        white-space: pre;
        font-family: "PP Mondwest";
      }
    </style>
  </head>
  <body>
    <h1 class="scramble">WELCOME TO THE REAL WORLD MICHELLE</h1>
    <br />
    <p class="scramble">Muahahaha.</p>

    <script>
      const config = {
        globalSpeed: 0.5, // lower = slower overall animation
        charSpeed: 0.1, // how much progress a char gains each “lock-in”
        changeRate: 0.1, // chance per frame to advance a char
      };

      const glyphs =
        "アァイィウゥエェオォカヵガキギクグケヶゲコゴサザシジスズセゼソゾタダチヂツッヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモヤャユュヨョラリルレロワヮヷヰヸヱヹヲヺンヴヿ";
      const elements = [...document.querySelectorAll(".scramble")];

      elements.forEach((el) => scrambleText(el));

      function scrambleText(el) {
        const text = el.textContent;
        const chars = text.split("");
        const progress = Array(chars.length).fill(0);
        el.textContent = "";

        const spanChars = chars.map((c) => {
          const span = document.createElement("span");
          span.textContent = randomGlyph();
          el.appendChild(span);
          return span;
        });

        let done = 0;
        let lastTime = performance.now();

        function frame(time) {
          const delta = (time - lastTime) * config.globalSpeed;
          lastTime = time;

          for (let i = 0; i < chars.length; i++) {
            if (progress[i] < 1) {
              if (Math.random() < (config.changeRate * delta) / 16) {
                progress[i] += config.charSpeed;
                if (progress[i] >= 1) {
                  spanChars[i].textContent = chars[i];
                  done++;
                } else {
                  spanChars[i].textContent = randomGlyph();
                }
              } else {
                spanChars[i].textContent = randomGlyph();
              }
            }
          }
          if (done < chars.length) requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
      }

      function randomGlyph() {
        return glyphs[Math.floor(Math.random() * glyphs.length)];
      }
    </script>
  </body>
</html>
