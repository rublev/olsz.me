<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pixelate Page with Three.js</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: linear-gradient(45deg, #ff9, #9cf);
        height: 200vh; /* scrollable just to show content */
      }
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
      }
      .content {
        padding: 50px;
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>Hello World</h1>
      <p>This is normal DOM text and images.</p>
      <img src="https://picsum.photos/400/200" alt="" />
    </div>

    <canvas id="overlay"></canvas>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>

    <script>
      const overlay = document.getElementById("overlay");
      let renderer, scene, camera, mesh;

      // Pixelation shader
      const PixelShader = {
        uniforms: {
          tDiffuse: { value: null },
          resolution: {
            value: new THREE.Vector2(window.innerWidth, window.innerHeight),
          },
          pixelSize: { value: 8.0 },
        },
        vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
      `,
        fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 resolution;
        uniform float pixelSize;
        varying vec2 vUv;
        void main() {
          vec2 dxy = pixelSize / resolution;
          vec2 coord = dxy * floor(vUv / dxy);
          gl_FragColor = texture2D(tDiffuse, coord);
        }
      `,
      };

      function init(texture) {
        renderer = new THREE.WebGLRenderer({ canvas: overlay });
        renderer.setSize(window.innerWidth, window.innerHeight);

        scene = new THREE.Scene();
        camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

        const material = new THREE.ShaderMaterial({
          uniforms: {
            tDiffuse: { value: texture },
            resolution: {
              value: new THREE.Vector2(window.innerWidth, window.innerHeight),
            },
            pixelSize: { value: 8.0 },
          },
          vertexShader: PixelShader.vertexShader,
          fragmentShader: PixelShader.fragmentShader,
        });

        mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
        scene.add(mesh);

        renderer.render(scene, camera);
      }

      // Take snapshot of body, then feed to shader
      html2canvas(document.body).then((canvas) => {
        const tex = new THREE.CanvasTexture(canvas);
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        init(tex);
      });
    </script>
  </body>
</html>
