      // Vertex shader
      const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

      // Fragment shader with real CRT curvature
      const fragmentShader = `
            uniform sampler2D uTexture;
            uniform float uTime;
            uniform vec2 uResolution;
            uniform float uCurvature;
            uniform float uScanlineIntensity;
            uniform float uVignetteIntensity;
            uniform float uNoiseAmount;

            varying vec2 vUv;

            // CRT Curvature function - this is the key!
            vec2 curve(vec2 uv, float amount) {
                uv = (uv - 0.5) * 2.0;
                uv *= 1.0 + dot(uv.yx, uv.yx) * amount;
                return (uv * 0.5) + 0.5;
            }

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            float valueNoise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                vec2 u = f * f * (3.0 - 2.0 * f);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }

            void main() {
                // Apply screen curvature first
                vec2 curvedUv = curve(vUv, uCurvature);
                vec2 effectUv = curvedUv;
                vec2 sampleUv = curvedUv;
                
                // Calculate glitch effect (subtle and infrequent)
                float glitchIntensity = 0.0;
                float glitchTrigger = random(vec2(floor(uTime * 0.3))); // Much slower trigger rate
                if (glitchTrigger > 0.96) { // 4% chance of glitch (very subtle)
                    if(random(vec2(uTime * 12.0)) > 0.80) { // Less likely to trigger
                        glitchIntensity = random(effectUv.yx + uTime) * 0.3 + 0.2; // Much weaker intensity
                        // Horizontal line displacement (very subtle)
                        effectUv.x += (valueNoise(effectUv * 8.0 + uTime * 6.0) - 0.5) * 0.06 * glitchIntensity;
                        // Vertical sync disruption (minimal)
                        effectUv.y += (random(vec2(effectUv.x + uTime * 15.0)) - 0.5) * 0.015 * glitchIntensity;
                        sampleUv = effectUv;
                    }
                }
                
                // Sample texture with glitch effects
                vec4 color = vec4(0.0, 0.0, 0.0, 1.0);
                vec4 baseSample = vec4(0.0);
                if (sampleUv.x >= 0.0 && sampleUv.x <= 1.0 && sampleUv.y >= 0.0 && sampleUv.y <= 1.0) {
                    if (glitchIntensity > 0.15) { // Chromatic aberration during glitch (subtle)
                        float r_offset = (random(sampleUv + uTime * 1.5) - 0.5) * 0.008 * glitchIntensity; // Subtle offset
                        float b_offset = (random(sampleUv + uTime * 1.8) - 0.5) * 0.008 * glitchIntensity; // Subtle offset
                        vec2 uvR = clamp(sampleUv + vec2(r_offset, 0.0), 0.0, 1.0);
                        vec2 uvB = clamp(sampleUv + vec2(b_offset, 0.0), 0.0, 1.0);
                        baseSample.r = texture2D(uTexture, uvR).r;
                        baseSample.g = texture2D(uTexture, sampleUv).g;
                        baseSample.b = texture2D(uTexture, uvB).b;
                        baseSample.a = texture2D(uTexture, sampleUv).a;
                    } else { // Normal sampling
                        baseSample = texture2D(uTexture, sampleUv);
                    }
                }
                color = baseSample;

                // Apply scanlines
                float scanline = sin(curvedUv.y * uResolution.y * 1.2 + uTime * 2.0) * uScanlineIntensity;
                color.rgb -= scanline;

                // Apply vignette
                float vignette = length((curvedUv - 0.5) * uVignetteIntensity);
                color.rgb = mix(color.rgb, vec3(0.0), vignette);

                // Apply noise (enhanced during glitch)
                float noiseAmount = uNoiseAmount + glitchIntensity * 0.04;
                float noise = (random(curvedUv + uTime * 0.1) - 0.5) * noiseAmount;
                color.rgb += noise;
                
                // Add horizontal glitch lines (signal interference) - very subtle
                if (glitchIntensity > 0.4) {
                    float lineY = curvedUv.y * uResolution.y;
                    float glitchLine = step(0.99, sin(lineY * 0.3 + uTime * 20.0)) * glitchIntensity * 0.5;
                    color.rgb += glitchLine * vec3(0.05, 0.03, 0.01); // Orange-ish glitch lines
                }

                // Add phosphor glow - Windows 3.1 amber/orange
                vec3 baseGlow = vec3(0.04, 0.025, 0.01); // Orange/amber base glow
                color.rgb += baseGlow * (1.0 - vignette * 0.7);

                // Windows 3.1 amber/orange tint
                vec3 tintMultiplier = vec3(1.2, 0.8, 0.4); // Orange tint instead of green
                color.rgb *= tintMultiplier;

                gl_FragColor = color;
            }
        `;

      function init() {
        // Create canvas for resume content
        resumeCanvas = document.createElement("canvas");
        resumeCanvas.width = 1200;
        resumeCanvas.height = 900;
        resumeCtx = resumeCanvas.getContext("2d");

        // Setup Three.js
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Setup texture
        resumeTexture = new THREE.CanvasTexture(resumeCanvas);
        resumeTexture.minFilter = THREE.LinearFilter;
        resumeTexture.magFilter = THREE.LinearFilter;

        // Setup uniforms
        uniforms = {
          uTexture: { value: resumeTexture },
          uTime: { value: 0.0 },
          uResolution: {
            value: new THREE.Vector2(window.innerWidth, window.innerHeight),
          },
          uCurvature: { value: 0.15 }, // Increased curvature for more obvious effect
          uScanlineIntensity: { value: 0.04 },
          uVignetteIntensity: { value: 1.2 },
          uNoiseAmount: { value: 0.02 },
        };

        // Create shader material
        const material = new THREE.ShaderMaterial({
          uniforms: uniforms,
          vertexShader: vertexShader,
          fragmentShader: fragmentShader,
          transparent: true,
        });

        // Create plane (larger to better fill screen)
        const geometry = new THREE.PlaneGeometry(10, 7.5);
        planeMesh = new THREE.Mesh(geometry, material);
        scene.add(planeMesh);

        // Position camera closer
        camera.position.z = 6;

        // Draw resume content
        drawResume();

        // Start animation
        animate();

        // Handle resize
        window.addEventListener("resize", onWindowResize);

        // Handle scrolling
        setupScrollHandlers();
      }

      function setupScrollHandlers() {
        // Mouse wheel scrolling
        window.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const scrollSpeed = 1; // Reduced from 3 to 1 for less sensitivity
            const deltaY = e.deltaY > 0 ? scrollSpeed : -scrollSpeed;
            const newTarget = targetScrollOffset + deltaY;
            targetScrollOffset = Math.max(
              0,
              Math.min(
                newTarget,
                Math.max(
                  0,
                  resumeText.length - Math.floor(resumeCanvas.height / 20) + 4,
                ),
              ),
            );
          },
          { passive: false },
        );

        // Keyboard scrolling
        window.addEventListener("keydown", (e) => {
          let scrollAmount = 0;

          switch (e.key) {
            case "ArrowUp":
              scrollAmount = -1;
              break;
            case "ArrowDown":
              scrollAmount = 1;
              break;
            case "PageUp":
              scrollAmount = -10;
              break;
            case "PageDown":
              scrollAmount = 10;
              break;
            case "Home":
              targetScrollOffset = 0;
              return;
            case "End":
              targetScrollOffset = maxScroll;
              return;
          }

          if (scrollAmount !== 0) {
            e.preventDefault();
            const newTarget = targetScrollOffset + scrollAmount;
            const maxScrollValue = Math.max(
              0,
              resumeText.length - Math.floor(resumeCanvas.height / 20) + 4,
            );
            targetScrollOffset = Math.max(
              0,
              Math.min(newTarget, maxScrollValue),
            );
          }
        });

        // Touch scrolling for mobile
        let touchStartY = 0;
        let touchEndY = 0;

        window.addEventListener(
          "touchstart",
          (e) => {
            touchStartY = e.touches[0].clientY;
          },
          { passive: true },
        );

        window.addEventListener(
          "touchmove",
          (e) => {
            e.preventDefault();
            touchEndY = e.touches[0].clientY;
            const deltaY = touchStartY - touchEndY;
            const scrollSpeed = 0.1;
            targetScrollOffset = Math.max(
              0,
              Math.min(targetScrollOffset + deltaY * scrollSpeed, maxScroll),
            );
            touchStartY = touchEndY;
          },
          { passive: false },
        );

        // Focus the window so keyboard events work
        window.focus();
      }

      function drawResume() {
        const lineHeight = 20;
        const fontSize = 16;
        const visibleLines = Math.floor(resumeCanvas.height / lineHeight) - 4; // Leave room for padding

        // Calculate max scroll based on content length
        maxScroll = Math.max(0, resumeText.length - visibleLines);

        // Clamp scroll offset to integer values to avoid array access issues
        scrollOffset = Math.floor(
          Math.max(0, Math.min(scrollOffset, maxScroll)),
        );

        // Clear canvas
        resumeCtx.fillStyle = "#000";
        resumeCtx.fillRect(0, 0, resumeCanvas.width, resumeCanvas.height);

        resumeCtx.fillStyle = "#FF8C00"; // Windows 3.1 orange color
        resumeCtx.font = `${fontSize}px "Courier New", monospace`;

        // Calculate horizontal centering - move more to the right
        const leftMargin = 150; // Much more right-aligned

        // Draw visible lines based on scroll offset
        for (let i = 0; i < visibleLines; i++) {
          const lineIndex = Math.floor(scrollOffset) + i;
          if (lineIndex >= 0 && lineIndex < resumeText.length) {
            const line = resumeText[lineIndex] || ""; // Fallback to empty string
            const y = (i + 3) * lineHeight; // Add more top padding
            resumeCtx.fillText(line, leftMargin, y);
          }
        }

        // Draw scroll indicator if there's more content - on the left side
        if (maxScroll > 0) {
          const scrollBarHeight = resumeCanvas.height - 40;
          const scrollBarY = 20;
          const scrollBarX = 15; // Left side instead of right

          // Scroll track
          resumeCtx.fillStyle = "#331100"; // Dark orange
          resumeCtx.fillRect(scrollBarX, scrollBarY, 8, scrollBarHeight);

          // Scroll thumb
          const thumbHeight = Math.max(
            20,
            (visibleLines / resumeText.length) * scrollBarHeight,
          );
          const thumbY =
            scrollBarY +
            (scrollOffset / maxScroll) * (scrollBarHeight - thumbHeight);

          resumeCtx.fillStyle = "#FF8C00"; // Orange
          resumeCtx.fillRect(scrollBarX, thumbY, 8, thumbHeight);

          // Scroll percentage at bottom left
          const scrollPercent =
            maxScroll > 0 ? Math.round((scrollOffset / maxScroll) * 100) : 0;
          resumeCtx.fillStyle = "#CC6600"; // Darker orange
          resumeCtx.font = `10px "Courier New", monospace`;
          resumeCtx.fillText(`${scrollPercent}%`, 30, resumeCanvas.height - 10);
        }

        resumeTexture.needsUpdate = true;
      }

      function animate() {
        requestAnimationFrame(animate);

        // Smooth scroll animation
        const scrollDiff = targetScrollOffset - scrollOffset;
        if (Math.abs(scrollDiff) > 0.1) {
          scrollOffset += scrollDiff * scrollSmoothing;
          drawResume();
        }

        uniforms.uTime.value = performance.now() * 0.001;

        renderer.render(scene, camera);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
      }

      // Initialize
      init();
    </script>
