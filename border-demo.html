<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixelated Border Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ff00ff;
      min-height: 100vh;
      font-family: monospace;
    }

    .demo-box {
      width: 100vw;
      height: 100vh;
      background: #00ffff;

      /* 9-patch border image */
      border: 155px solid transparent;
      border-image-source: url('vignette-9patch.svg');
      border-image-slice: 155;
      border-image-width: 155px;
      border-image-repeat: repeat;

      /* Keep pixels crisp - no anti-aliasing */
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;

      /* Prevent subpixel rendering */
      transform: translateZ(0);
      backface-visibility: hidden;

      /* Center content */
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 32px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="demo-box">
    Pixelated 9-Patch Border
  </div>
</body>
</html>
